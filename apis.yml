aid: bezero-carbon
name: BeZero Carbon
description: 'BeZero Carbon is a global carbon ratings agency for the Voluntary Carbon Market, founded
  in London in 2020. It publishes an independent, eight-point BeZero Carbon Rating (AAA to D) expressing
  the likelihood that a given carbon credit achieves a tonne of CO2e avoided or removed, alongside risk
  factor scores, summary analysis, methodology assessments and reference data across forestry, blue carbon,
  soil and agriculture, cookstoves, engineered removals and superpollutant projects. The BeZero Ratings
  API (v3, OAuth 2.0 client credentials) lets exchanges, marketplaces, brokers, data providers and
  corporate buyers pull ratings, project reference data and premium risk factor scores directly into
  their own platforms, and its ratings are distributed through Bloomberg, ICE, CUSIP and LSEG.'
