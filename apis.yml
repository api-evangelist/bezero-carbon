apis:
- aid: bezero-carbon-ratings-api
  name: BeZero Ratings API
  description: 'The BeZero Ratings API returns BeZero Carbon project ratings in a standard JSON response.
    It exposes a paginated list of ratings (AAA to D, plus Withdrawn), each carrying the rating watch
    status, vintage range, summary analysis and a platform URL; a paginated list of rated projects with
    accreditor, registry ID, sector group, sector, sub-sector and ISO 3166-1 alpha-3 location; and a
    premium risk-factors endpoint returning additionality, carbon accounting and permanence scores.
    Authentication is OAuth 2.0 client credentials against the BeZero token server, with four scopes.
    The list endpoints support incremental sync via a changedSince filter over dataLastUpdatedAt, and
    clients opt into behaviour with the Accept-API-Version header (3.0 default, 3.1 supported).'
