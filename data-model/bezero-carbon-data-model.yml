id_conventions:
  bezero_id: >-
    Opaque string. Published examples are ABC123, DEF123 and GH1000000100 — no fixed prefix
    or length, so treat as opaque and never construct one.
  registry_id: >-
    The identifier the project carries in its own registry's documentation (example
    GH_1000000_100 where the BeZero id is GH1000000100). Not interchangeable with the BeZero id.
  join_key: >-
    Rating.projectID joins to Project.id. Rating.registryID and Project.registryID both carry the
    registry-side identifier and can be used to reconcile against a registry export.
change_tracking:
  field: dataLastUpdatedAt
  present_on: [Project, Rating]
  note: >-
    Any change to data returned by the ratings list or rating details bumps dataLastUpdatedAt,
    so it is the single watermark for incremental sync across both entities.
gaps:
- >-
  No components.schemas — every entity is an anonymous inline schema, so nothing in the spec is
  reusable, nameable, or generatable into typed models without hand-naming it first.
- >-
  There is no operation to fetch a single project by id; Project is only reachable by paging
  the full list or filtering with changedSince.
