gaps:
- >-
  No error body schema is published for any status, so a client cannot parse a machine-readable
  reason and must branch on the HTTP status alone.
- >-
  No error code registry. A 403 covering "no token", "expired token" and "not entitled to the
  Premium tier" is three very different operator actions behind one status.
- >-
